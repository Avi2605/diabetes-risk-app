
name: Keep Streamlit App Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Streamlit response
        run: |
          URL="https://diabetes-risk-app-2cuu4wbqt9bkdkbqryeg8r.streamlit.app/"

          curl --silent --show-error \
            --location \
            --max-redirs 5 \
            --max-time 30 \
            --output /tmp/response.html \
            --write-out "\nFinal HTTP status: %{http_code}\nFinal URL: %{url_effective}\nRedirects: %{num_redirects}\n" \
            "$URL" || true

          echo "Response title:"
          grep -oiE '<title>[^<]*</title>' /tmp/response.html | head -1 || true
