
name: Keep Streamlit App Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Streamlit URL
        run: |
          URL="https://diabetes-risk-app-2cuu4wbqt9bkdkbqryeg8r.streamlit.app/"

          echo "Checking response without following redirects..."
          curl --silent --show-error \
            --max-time 20 \
            --output /dev/null \
            --dump-header - \
            "$URL"
