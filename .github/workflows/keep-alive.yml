
name: Keep Streamlit App Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect and Wake Streamlit
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          url = "https://diabetes-risk-app-2cuu4wbqt9bkdkbqryeg8r.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              try:
                  print("Opening app...")
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  time.sleep(5)
                  print("Page title:", page.title())
                  print("Current URL:", page.url)

                  wake_button = page.get_by_role(
                      "button",
                      name="Yes, get this app back up!",
                      exact=False
                  )

                  if wake_button.count() and wake_button.first.is_visible():
                      print("Sleeping page detected. Waking app...")
                      wake_button.first.click()
                      time.sleep(10)

                  if "Diabetes Risk Checker" in page.title():
                      print("App page detected successfully.")
                  else:
                      raise RuntimeError(
                          "App page not detected. "
                          "Title: " + page.title()
                      )
              finally:
                  browser.close()
          PY
