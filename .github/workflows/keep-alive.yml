
name: Keep Streamlit App Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          URL="https://diabetes-risk-app-2cuu4wbqt9bkdkbqryeg8r.streamlit.app/"

          echo "Checking app response..."
          curl --silent --show-error \
            --location \
            --max-redirs 5 \
            --max-time 60 \
            --output /tmp/response.html \
            --write-out "\nHTTP status: %{http_code}\nFinal URL: %{url_effective}\n" \
            "$URL"

          echo "Checking response content..."
          if grep -qi "gone to sleep\|get this app back up" /tmp/response.html; then
            echo "App is sleeping; the ping did not wake it."
            exit 1
          fi
