
name: Keep Streamlit App Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect and Wake Streamlit
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          url = "https://diabetes-risk-app-2cuu4wbqt9bkdkbqryeg8r.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_default_timeout(10000)

              try:
                  print("Opening app...")
                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  time.sleep(3)

                  print("URL:", page.url)
                  print("Title:", page.title())
                  print("Page text:", page.locator("body").inner_text()[:3000])

                  page.screenshot(
                      path="/tmp/streamlit-debug.png",
                      full_page=True
                  )

                  button = page.get_by_role(
                      "button",
                      name="Yes, get this app back up!",
                      exact=False
                  )

                  if button.count() and button.first.is_visible():
                      print("Sleeping page detected; clicking wake button.")
                      button.first.click()
                      time.sleep(10)

                  deadline = time.time() + 90

                  while time.time() < deadline:
                      text = page.locator("body").inner_text()

                      if "This app has gone to sleep" in text:
                          print("App is still showing the sleeping page.")
                      elif page.locator(
                          '[data-testid="stAppViewContainer"]'
                      ).count():
                          print("Streamlit app container detected.")
                          print("Final URL:", page.url)
                          break
                      else:
                          print("Waiting for app. Current URL:", page.url)

                      time.sleep(5)
                  else:
                      print("App interface was not confirmed.")
                      print("Final URL:", page.url)
                      print("Final page text:")
                      print(page.locator("body").inner_text()[:3000])

                      raise RuntimeError(
                          "App did not become detectable. "
                          "Inspect the debug screenshot."
                      )

              finally:
                  browser.close()
          PY

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-debug
          path: /tmp/streamlit-debug.png
          if-no-files-found: ignore
